[package]
name = "animo-media-player"
version = "0.1.0"
description = "Animo Media Player"
authors = ["luisvalencia"]
edition = "2021"

[lib]
name = "animo_media_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
lofty = "0.22"
base64 = "0.22"
tiny_http = "0.12.0"
